<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Entity Resolution — Project Atlas</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2430; --line:#30363d; --line2:#3d4653;
    --fg:#e6edf3; --fg2:#adbac7; --fg3:#768390;
    --blue:#4c8eda; --green:#57ab5a; --amber:#daa312; --red:#e5534b;
    --purple:#b083f0; --cyan:#39c5cf; --pink:#db61a2; --orange:#e0823d;
    --hl:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

  /* ---------- header ---------- */
  header{
    height:56px; display:flex; align-items:center; gap:18px; padding:0 18px;
    background:var(--bg2); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .brand span{font-size:11px;color:var(--fg3)}
  nav{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
  nav button{
    background:transparent;border:1px solid transparent;color:var(--fg2);
    padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;
  }
  nav button:hover{background:var(--bg3);color:var(--fg)}
  nav button.on{background:#1f6feb22;border-color:#1f6feb66;color:#79c0ff}
  .hud{margin-left:auto;display:flex;gap:6px;align-items:center}
  .hud button{
    background:var(--bg3);border:1px solid var(--line);color:var(--fg2);
    padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11.5px;
  }
  .hud button:hover{border-color:var(--line2);color:var(--fg)}

  /* ---------- layout ---------- */
  .wrap{display:flex;height:calc(100% - 56px)}
  .main{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.drag{cursor:grabbing}

  /* ---------- graph nodes ---------- */
.node rect {
  fill: var(--bg2);
  stroke: var(--line2);
  stroke-width: 1.5px;
  transition: fill 0.12s, stroke 0.12s;
}
  .node{cursor:pointer}
  .node:hover rect{stroke:var(--blue);fill:var(--bg3)}
  .node.sel rect{stroke:var(--hl);stroke-width:2.5;fill:#1c2430}
  .node .t{font-size:12.5px;font-weight:600;fill:var(--fg)}
  .node .s{font-size:10.5px;fill:var(--fg3);font-family:ui-monospace,monospace}
  .node .badge{font-size:9.5px;font-weight:700;letter-spacing:.4px}
  .edge{stroke:var(--line2);stroke-width:1.6;fill:none}
  .edge.hot{stroke:var(--hl);stroke-width:2.6}
  .elabel{font-size:9.5px;fill:var(--fg3);font-family:ui-monospace,monospace}
  .grp rect {
  fill: rgba(255, 255, 255, 0.02);
  stroke: var(--line);
  stroke-dasharray: 4 4;
  rx: 12px;
}
  .grp .gt{font-size:11px;fill:var(--fg3);font-weight:700;letter-spacing:1px}

  /* ---------- legend ---------- */
  .legend{
    position:absolute;left:14px;bottom:14px;background:#161b22ee;border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font-size:11px;color:var(--fg2);
    display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(3px);
  }
  .legend div{display:flex;align-items:center;gap:7px}
  .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

  /* ---------- stats strip ---------- */
  .stats{
    position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;
    background:#161b22ee;border:1px solid var(--line);border-radius:8px;padding:10px 13px;
    font-size:11.5px;backdrop-filter:blur(3px);min-width:210px;
  }
  .stats h4{margin:0 0 3px;font-size:10px;letter-spacing:1px;color:var(--fg3);font-weight:700}
  .stats .row{display:flex;justify-content:space-between;gap:14px}
  .stats .row b{font-weight:600;color:var(--fg)}
  .stats .row span{color:var(--fg3);font-family:ui-monospace,monospace;font-size:11px}

  /* ---------- detail panel ---------- */
  .panel{
    width:0;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--line);
    overflow-y:auto;overflow-x:hidden;transition:width .18s ease;
  }
  .panel.open{width:480px}
  .panel::-webkit-scrollbar{width:9px}
  .panel::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  .p-head{
    position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);
    padding:15px 18px 12px;z-index:2;
  }
  .p-kind{font-size:9.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
  .p-head h2{margin:5px 0 3px;font-size:17px;font-weight:650;line-height:1.3}
  .p-head .path{font-size:11px;color:var(--fg3);font-family:ui-monospace,monospace}
  .p-body{padding:16px 18px 60px}
  .p-body h3{
    font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--fg3);
    margin:20px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line);font-weight:700;
  }
  .p-body h3:first-child{margin-top:0}
  .p-body p{margin:0 0 10px;color:var(--fg2);font-size:13px}
  .p-body ul{margin:0 0 10px;padding-left:18px;color:var(--fg2);font-size:13px}
  .p-body li{margin-bottom:5px}
  .p-body code{background:#010409;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px;color:#a5d6ff}
  pre{
    background:#010409;border:1px solid var(--line);border-radius:6px;padding:11px 13px;
    overflow-x:auto;font-size:11.5px;line-height:1.55;color:#c9d1d9;margin:0 0 10px;
  }
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12.5px;margin-bottom:10px}
  .kv dt{color:var(--fg3);font-family:ui-monospace,monospace;font-size:11px}
  .kv dd{margin:0;color:var(--fg2)}
  .pit{border-left:3px solid var(--amber);background:#daa3120f;padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px}
  .pit.ok{border-color:var(--green);background:#57ab5a0f}
  .pit.bad{border-color:var(--red);background:#e5534b0f}
  .pit b{font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:3px}
  .pit span{font-size:12.5px;color:var(--fg2)}
  .io{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{
    background:var(--bg3);border:1px solid var(--line2);border-radius:5px;
    padding:3px 8px;font-size:11px;font-family:ui-monospace,monospace;color:var(--fg2);
  }
  .chip.in{border-color:#57ab5a55;color:#7ee787}
  .chip.out{border-color:#4c8eda55;color:#79c0ff}
  .close{
    position:absolute;top:13px;right:15px;background:none;border:none;color:var(--fg3);
    cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:4px;
  }
  .close:hover{background:var(--bg3);color:var(--fg)}
  .p-head{position:sticky}
  .help{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    color:var(--fg3);font-size:13px;pointer-events:none;
  }
  @media(max-width:1100px){.panel.open{width:380px}.stats{display:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Business Entity Resolution</h1>
    <span>Project Atlas — architecture &amp; pipeline explorer</span>
  </div>
  <nav id="nav"></nav>
  <div class="hud">
    <button id="zin">+</button>
    <button id="zout">&minus;</button>
    <button id="fit">fit</button>
    <button id="relayout">relayout</button>
  </div>
</header>

<div class="wrap">
  <div class="main">
    <svg id="svg"><g id="viewport"></g></svg>
    <div class="legend" id="legend"></div>
    <div class="stats" id="stats"></div>
  </div>
  <aside class="panel" id="panel">
    <button class="close" id="close">&times;</button>
    <div class="p-head" id="phead"></div>
    <div class="p-body" id="pbody"></div>
  </aside>
</div>

<script>
"use strict";
/* ==========================================================================
   NODE REGISTRY  — every entry mirrors the real code in src/ and the runners.
   ========================================================================== */
const K = {
  file:{c:"#4c8eda",t:"FILE"},
  fn:{c:"#57ab5a",t:"FUNCTION"},
  stage:{c:"#b083f0",t:"STAGE"},
  art:{c:"#e0823d",t:"ARTIFACT"},
  out:{c:"#39c5cf",t:"OUTPUT"},
  dec:{c:"#f0b429",t:"DECISION"},
  data:{c:"#adbac7",t:"DATA"},
  gap:{c:"#e5534b",t:"GAP"},
  env:{c:"#db61a2",t:"ENV"}
};

const N = {};

/* ------------------------------------------------------------------ DATA */
N.ds_train1={k:K.data,label:"train_source1.tsv",sub:"2,206,821 rows · 210 MB",
  path:"dataset/train/",file2:"",lines:"",
  d:["The deduplicated <b>reference</b> source. Every other file is matched <i>to</i> this one, and only S1 entities appear as rows in the submission."],
  kv:{"Columns":"entity_id, business_name, business_address, country","Separator":"TAB (\u005ct) — reading without sep='\\t' silently yields one column","Countries":"US 1,323,633 · India 883,188","Empty name":"0 (0.000%)","Empty address":"0 (0.000%)","Mean name length":"24.0 chars"},
  pit:{t:"ground truth covers all 2,206,821",b:"",s:"train_ground_truth.tsv has exactly one row per S1 entity, so no S1 is missing a label. 123,247 of them carry an empty match list (true singletons)."}};

N.ds_train2={k:K.data,label:"train_source2.tsv",sub:"5,034,616 rows · 489 MB",
  path:"dataset/train/",
  d:["Noisy business records. Roughly 2.3 S2 rows exist per S1 entity. S2 ids are unique only <i>within</i> S2, so an S2 and an S3 row may share a literal id string."],
  kv:{"Countries":"US 3,016,817 · India 2,017,799","Empty address":"168,967 (3.356%)","Mean name length":"25.1 chars"},
  pit:{t:"id collision is real",b:"bad",s:"RecordRef identity is the (source, entity_id) <i>pair</i>, never the bare id. Keying a dict on entity_id alone would silently merge an S2 row with an S3 row and attribute a candidate to the wrong source."}};

N.ds_train3={k:K.data,label:"train_source3.tsv",sub:"5,285,603 rows · 504 MB",
  path:"dataset/train/",
  d:["The second noisy source. Together with S2 it forms the 10,320,219-row candidate pool that blocking indexes once and queries 2.2M times."],
  kv:{"Countries":"US 3,170,056 · India 2,115,547","Empty address":"175,916 (3.328%)","Mean name length":"25.2 chars"},
  pit:{t:"pool is the hot path",b:"",s:"Everything downstream is bounded by this 10.32M-row index. Building it costs ~4 min; querying 1.73M test S1 against it is the single most expensive operation in the project."}};

N.ds_test1={k:K.data,label:"test_source1.tsv",sub:"1,732,544 rows · 175 MB",
  path:"dataset/test/",
  d:["S1 entities to predict for. <b>Every one of them must get exactly one row</b> in matching_results.tsv, or the submission is rejected outright."],
  kv:{"Countries":"India 809,986 · US 663,106 · <b>France 259,452</b>","Empty name/address":"0 / 0"},
  pit:{t:"France is unseen in training",b:"",s:"France appears only in test. Country is embedded inside every blocking key, so French rows can only ever match French rows — that is the desired behaviour, but it means the 259,452 French S1 rows are scored entirely on a name-key path that was never validated on French addresses."}};

N.ds_test23={k:K.data,label:"test_source2/3.tsv",sub:"4,887,273 + 5,082,316 · 1.0 GB",
  path:"dataset/test/",
  d:["The test candidate pool, 9,969,589 rows. Indexed exactly like the training pool, with no test labels ever being read."],
  kv:{"S2 countries":"India 2,312,565 · US 1,871,330 · France 703,378","S3 countries":"India 2,405,000 · US 1,945,701 · France 731,615","Empty address":"S2 2.648% · S3 2.678%"},
  pit:{t:"read-only until the model is frozen",b:"bad",s:"These files may only be opened during final inference, after blocking, features, model and threshold are all locked. No test statistic may feed back into any of those choices."}};

N.ds_gt={k:K.data,label:"train_ground_truth.tsv",sub:"2,206,821 rows · 127 MB",
  path:"dataset/train/",
  d:["The only source of supervision. Two columns: <code>source1_entity_id</code> and a comma-separated <code>matched_entity_ids</code> list, empty for singletons. 7,638,365 true pairs in total — 3,693,619 into S2 and 3,944,746 into S3."],
  kv:{"S1 rows":"2,206,821 (100% of train S1)","<b>Singletons</b>":"<b>123,247 (5.585%)</b>","Mean matches / entity":"3.461","Targets S2":"3,693,619 (48.4%)","Targets S3":"3,944,746 (51.6%)"},
  code:"matches-per-entity histogram\n  0 (singleton) 123,247   5  321,957\n  1             119,157   6  164,868\n  2             375,212   7   63,968\n  3             530,841   8   18,680\n  4             484,115   9    4,205\n                       10+     571",
  pit:{t:"an absent row means 'no match'",b:"",s:"label_candidates() defaults a reference id that is missing from this file to an empty match set. The file enumerates matches exhaustively, so absence is negative evidence, not missing data."}};

/* -------------------------------------------------------- PREPROCESSING */
N.pp_entry={k:K.fn,label:"preprocess_record()",sub:"the only record-level entry point",
  path:"src/preprocessing.py:255",
  d:["The single funnel every source row passes through. It composes the field normalisers and returns a frozen <code>PreprocessedRecord</code>. No file I/O, no third-party imports, no randomness — the whole module is pure, which is what makes cached artefacts valid."],
  io:{in:["entity_id","business_name","business_address","country"],out:["PreprocessedRecord"]},
  code:"name    = normalize_name(business_name)\naddress = normalize_address(business_address)\nPreprocessedRecord(\n    entity_id=entity_id,          # never altered\n    country  = normalize_country(country),\n    name=name, name_core=core_tokens(name),\n    address=address,\n    address_tokens=address_tokens(address),\n    address_alpha_tokens=address_alpha_tokens(address),\n    house_number=extract_house_number(address),\n    name_is_missing=is_missing(business_name),\n    address_is_missing=is_missing(business_address),\n)",
  pit:{t:"entity_id is never touched",b:"ok",s:"Normalisation applies to text fields only. Every id keeps its original spelling and prefix, which is what lets the submission be joined back to the source files."}};

N.pp_norm_text={k:K.fn,label:"normalize_text()",sub:"casefold · & → and · accents · punctuation",
  path:"src/preprocessing.py:118",
  d:["The canonical comparison form. The order of the steps matters: casefold first (so the apostrophe list is matched in its folded form), then ampersand expansion, then apostrophe removal, then accent folding, then separator substitution, then whitespace collapse."],
  code:"text = value.casefold().replace('&', ' and ')\nfor mark in (\"'\", '\\u2019', '\\u02bc', '\\uff07'):\n    text = text.replace(mark, '')      # drop, don't split\ntext = _fold_latin_accents(text)\nreturn _WHITESPACE_RE.sub(' ', _to_separators(text)).strip()",
  pit:{t:"ampersand becomes a real word",b:"",s:"<code>&</code> expands to <code>and</code> rather than a space, so <code>A&amp;B</code> and <code>A and B</code> normalise identically. But <code>and</code> is also in LEGAL_SUFFIX_TOKENS, so it is later dropped from core name tokens — the two decisions are independent and both deliberate."}};

N.pp_fold={k:K.fn,label:"_fold_latin_accents()",sub:"NFKD → strip Mn on Latin → NFC",
  path:"src/preprocessing.py:80",
  d:["Folds accents only where an accent sits directly on a Latin letter. A Devanagari combining vowel sign is preserved because the character before it is not a Latin letter. A naive <code>category(ch)=='Mn'</code> filter would strip Indic vowel signs and silently damage every native-script name."],
  code:"out, on_latin = [], False\nfor ch in unicodedata.normalize('NFKD', text):\n    if unicodedata.category(ch) == 'Mn' and on_latin:\n        continue                       # accent on a Latin letter\n    out.append(ch)\n    on_latin = ch.isascii() and ch.isalpha()\nreturn unicodedata.normalize('NFC', ''.join(out))",
  pit:{t:"recomposition is required, not cosmetic",b:"",s:"Without the final NFC pass, NFKD would leave Indic consonants in a decomposed form that is needlessly hard to compare byte-wise and in blocking keys."}};

N.pp_sep={k:K.fn,label:"_to_separators()",sub:"keeps letters, numbers and marks of any script",
  path:"src/preprocessing.py:102",
  d:["Replaces every character that is not a letter, number or mark with a space. Marks are kept because they carry meaning in Indic scripts. A regex fast path is used for pure-ASCII input, where the two implementations are provably identical."],
  code:"if text.isascii():\n    return _SEPARATORS_RE.sub(' ', text)      # [\\W_]+ with re.UNICODE\nreturn ''.join(\n    ch if unicodedata.category(ch)[0] in ('L','N','M') else ' '\n    for ch in text)",
  pit:{t:"ASCII fast path is safe",b:"ok",s:"No mark characters exist in ASCII, so for ASCII input the per-character loop and the regex produce identical output. The shortcut cannot change a result."}};

N.pp_missing={k:K.fn,label:"is_missing()",sub:"whole-field placeholder check only",
  path:"src/preprocessing.py:139",
  d:["A field counts as missing when it is <code>None</code>, blank, or equal to a literal placeholder such as <code>null</code>, <code>n/a</code> or <code>na</code>. The normalised spellings are derived from the same tuple, so the raw and normalised checks can never drift apart."],
  kv:{"Placeholders":"'', -, --, ?, n/a, na, nan, null","Matching":"whole field only, case-insensitive"},
  pit:{t:"a stray 'na' inside a real address is kept",b:"",s:"Only whole-field matches are treated as missing. Discarding a token that happens to equal 'na' would throw away genuine address content."}};

N.pp_country={k:K.fn,label:"normalize_country()",sub:"open set — deliberately NOT filtered",
  path:"src/preprocessing.py:173",
  d:["Returns the normalised label as an opaque string. No vocabulary, no mapping to codes, no one-hot, no allow-list. This is a direct requirement of the problem statement."],
  code:"if value is None or not value.strip():\n    return ''\nreturn normalize_text(value)",
  pit:{t:"MISSING_PLACEHOLDERS is intentionally NOT applied here",b:"bad",s:"<code>na</code> is a legitimate country code (Namibia) as well as a common way of writing 'not available'. Applying the free-text placeholder set to country would silently delete a real open-set value. Only a value with no characters at all is dropped."}};

N.pp_core={k:K.fn,label:"core_tokens()",sub:"drops 18 legal / generic tokens",
  path:"src/preprocessing.py:189",
  d:["Takes an <i>already normalised</i> name so callers never pay to normalise the same field twice. Returns tokens in original order with the legal-suffix set removed."],
  kv:{"Removed set":"inc, llc, ltd, co, corp, company, plc, gmbh, sa, sas, pvt, private, limited, llp, lp, the, and, of, center, services, group, enterprises","Removal":"per token, anywhere — not just trailing"},
  pit:{t:"two preserved quirks",b:"",s:"(1) <code>and</code>, <code>of</code> and <code>the</code> are removed wherever they occur. (2) Removal is per token rather than only at the end. Both were present when the 76.6% blocking recall was measured, so they are kept on purpose. Extending this set changes every name blocking key and invalidates the blocking numbers."}};

N.pp_addr={k:K.fn,label:"address_tokens() / address_alpha_tokens()",sub:"all tokens vs. meaningful words",
  path:"src/preprocessing.py:201, 208",
  d:["Two views of the address. <code>address_tokens</code> is every token including numbers and short words. <code>address_alpha_tokens</code> keeps only tokens of length ≥ 3 that contain a letter — the words worth blocking and scoring on."],
  pit:{t:"'contains a letter', not isalpha()",b:"bad",s:"<code>str.isalpha()</code> returns False for a Devanagari word carrying a vowel sign, so using it would silently drop every native-script address word. The check is a per-character category test instead."}};

N.pp_house={k:K.fn,label:"extract_house_number()",sub:"first all-digit token, else None",
  path:"src/preprocessing.py:221",
  d:["Scans address tokens in order and returns the first one that is entirely digits. A house number is optional: the function returns <code>None</code> rather than guessing, and <code>str.isdigit()</code> is Unicode-aware so native-script digits work."],
  pit:{t:"this single function gates the whole address key family",b:"bad",s:"Because <code>address_blocking_keys()</code> returns an empty tuple when there is no house number, any record without a digit token can <i>only</i> be reached through the name key. This is the suspected failure mode for French test data, whose addresses often lack a leading house number."}};

N.pp_rec={k:K.data,label:"PreprocessedRecord",sub:"frozen dataclass · 10 fields",
  path:"src/preprocessing.py:239",
  d:["The currency of the whole pipeline. Frozen, so it is hashable and safe to share. Built once per source row and then reused for every pair it participates in, which is what makes the index cheap."],
  kv:{"identity":"entity_id","text":"country, name, address","derived":"name_core, address_tokens, address_alpha_tokens, house_number","flags":"name_is_missing, address_is_missing"},
  pit:{t:"reuse across candidates is the design",b:"ok",s:"One S1 record is compared against ~319 candidates, so its derived token sets are computed once and read many times. Anything that forces recomputation per pair shows up directly in wall-clock time."}};

/* -------------------------------------------------------------- BLOCKING */
N.bl_cfg={k:K.fn,label:"BlockingConfig",sub:"2 tok · prefix 4 · addr prefix 3 · cap 1000",
  path:"src/blocking.py:73",
  d:["Frozen config carrying the <i>structure</i> of the keys. Deliberately does not encode any measured recall or volume, so the numbers can be re-derived on new data instead of being trusted blindly. Every field is validated in <code>__post_init__</code>."],
  kv:{"name_token_count":"2","name_prefix_length":"4","address_prefix_length":"3","address_word_count":"2","max_group_size":"1000"},
  pit:{t:"318.7 candidates per S1 entity is high",b:"bad",s:"Measured on the 20k subset with defaults. Under a precision-weighted F0.5 that many candidates is mostly false-positive surface. Tightening the cap is the single highest-leverage change available and it also cuts inference cost proportionally."}};

N.bl_ref={k:K.fn,label:"RecordRef / CandidatePair",sub:"(source, entity_id) identity",
  path:"src/blocking.py:112, 132",
  d:["Both are frozen, ordered dataclasses. <code>CandidatePair</code> is one retrieved (reference, candidate) pair and is what the whole feature and labelling layer consumes."],
  pit:{t:"source is part of the identity",b:"bad",s:"S2 and S3 ids are only unique within their own file, so two rows from different sources can carry the same literal id. Keying on the id alone would silently merge them and attribute a candidate to the wrong source."}};

N.bl_name={k:K.fn,label:"name_blocking_key()",sub:"the name_2tok key",
  path:"src/blocking.py:144",
  d:["Sorts the core name tokens alphabetically, keeps the first two, cuts each to four characters, and prefixes the tag and country. Truncation is what absorbs small spelling variations and keeps the key short enough to be selective."],
  code:"tokens = sorted(record.name_core)          # order-insensitive\nif not tokens:\n    return None\nreturn ('name_2tok', record.country,\n        *(t[:4] for t in tokens[:2]))",

N.bl_addr={k:K.fn,label:"address_blocking_keys()",sub:"addr_ht0 / addr_ht1",
  path:"src/blocking.py:205",
  d:["Pairs the house number with a 3-character prefix of each of the two longest useful address words. Two records must agree on the building <i>and</i> roughly on the street before they are compared at all."],
  code:"house_number = record.house_number\nif not house_number:\n    return ()          # nothing to anchor to\nfor position, word in enumerate(_longest_address_words(record, 2)):\n    keys.append((f'addr_ht{position}', record.country,\n                 house_number, word[:3]))\nreturn tuple(dict.fromkeys(keys))   # dedupe",

N.bl_keys={k:K.fn,label:"blocking_keys()",sub:"union of all routes, deterministic order",
  path:"src/blocking.py:245",

  pit:{t:"strategy tag prevents cross-family collision",b:"ok",s:"The leading tag means a name key can never collide with an address key, even if a country label or token happens to look like a house number. It also means the families could later share one dict without a migration."}};

N.bl_index={k:K.fn,label:"BlockingIndex",sub:"dict key → [RecordRef]",
  path:"src/blocking.py:285",
  d:["One flat dict for all three families, since the strategy tag keeps them separate. Lookups stay a single dict probe per key and <code>stats()</code> can report across all strategies at once. <code>retrieve()</code> yields the raw union including duplicates on purpose; the caller dedupes once at the end."],
  code:"def retrieve(self, record):\n    for key in blocking_keys(record, self.config):\n        bucket = self._buckets.get(key)\n        if bucket:\n            yield from bucket\n\ndef candidates_for(self, record):\n    return tuple(sorted(set(self.retrieve(record))))",
  pit:{t:"the cap is applied at INSERTION, so contents depend on input order",b:"",s:"The first 1000 records to reach a key win. Records are added in file order, which is deterministic, so repeated runs agree — but a key that overflows is a key too generic to be evidence of a match, and the overflow is dropped rather than truncated."}};

  code:"def _ratio(a, b):\n    return SequenceMatcher(None, a, b, autojunk=False).ratio()\n\n@lru_cache(maxsize=1 << 16)\ndef _bigrams(text):\n    if len(text) < 2:\n        return frozenset((text,)) if text else frozenset()\n    return frozenset(text[i:i+2] for i in range(len(text)-1))",

  code:"name:    exact, char_ratio, bigram_jaccard, len_ratio,\n          core_sorted_exact, core_jaccard, core_overlap,\n          core_token_ratio, core_prefix4_equal\naddress: exact, char_ratio, bigram_jaccard, token_jaccard,\n          alpha_jaccard, alpha_overlap, token_ratio\nhouse:   house_number_equal, house_number_conflict\ncountry: country_equal, country_present_either\nquality: name_present_both, address_present_both,\n          name_core_present_either, address_alpha_present_either",
  pit:{t:"there is no NaN anywhere, by design",b:"ok",s:"A tree model can route around NaN but a linear model propagates it into every downstream product. Absence is encoded as 0.0 plus a presence flag instead — see the gating rule below."}};

N.fe_extract={k:K.fn,label:"extract_features()",sub:"the 24-feature computation",

  code:"# gated on BOTH sides having the field\nif name_present:\n    name_exact = 1.0 if name_l == name_r else 0.0\n    name_char_ratio = _ratio(name_l, name_r)\n    ...\nelse:\n    name_exact = name_char_ratio = 0.0   # 'no evidence', NOT 'no similarity'",

/* ==========================================================================
   LAYOUT + RENDER
   ========================================================================== */
const NW=186, NH=54, GX=78, GY=26;
let cur="overview", sel=null, pos={}, g={k:1, x:0, y:0};

function layout(key){
  const v=VIEWS[key], p={};
  v.layers.forEach((layer,li)=>{
    layer.forEach((id,oi)=>{
      p[id]={x: li*(NW+GX), y: oi*(NH+GY), layer:li};
    });
  });
  pos=p;
  // vertical centre of each layer
  const counts=v.layers.map(l=>l.length);
  const maxRows=Math.max(...counts);
  v.layers.forEach((layer,li)=>{
    const h=counts[li]*NH+(counts[li]-1)*GY;
    const top=(maxRows*NH+(maxRows-1)*GY-h)/2;
    layer.forEach((id,oi)=>{ p[id].y = top + oi*(NH+GY); });
  });
  const w=v.layers.length*(NW+GX)-GX, h=maxRows*NH+(maxRows-1)*GY;
  return {w,h};
}

function render(){
  const vp=document.getElementById("viewport");
  const {w,h}=layout(cur);
  const v=VIEWS[cur];
  let s=`<text class="elabel" x="0" y="-42" style="font-size:13px;fill:#768390">${v.title} — ${v.note}</text>`;

  // edges first (behind nodes)
  v.edges.forEach(([a,b,lab])=>{
    if(!pos[a]||!pos[b]) return;
    const A=pos[a],B=pos[b];
    const x1=A.x+NW, y1=A.y+NH/2, x2=B.x, y2=B.y+NH/2;
    const dx=Math.max(40,(x2-x1)/2);
    s+=`<path class="edge" data-a="${a}" data-b="${b}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"/>`;
    if(lab) s+=`<text class="elabel" x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle">${lab}</text>`;
  });

  v.layers.forEach((layer)=>layer.forEach(id=>{
    const n=N[id], p=pos[id]; if(!n||!p) return;
    const col=n.k.c;
    s+=`<g class="node${sel===id?" sel":""}" data-id="${id}" transform="translate(${p.x},${p.y})">`
     + `<rect width="${NW}" height="${NH}"/>`;
    // colour bar
    s+=`<rect x="0" y="0" width="4" height="${NH}" fill="${col}" rx="2"/>`;
    s+=`<text class="badge" x="14" y="17" fill="${col}">${n.k.t}</text>`;
    s+=`<text class="t" x="14" y="33">${esc(n.label)}</text>`;
    s+=`<text class="s" x="14" y="47">${esc(n.sub)}</text>`;
    s+=`</g>`;
  }));

  vp.innerHTML=s;
  vp.querySelectorAll(".node").forEach(gEl=>{
    gEl.addEventListener("click",()=>open(gEl.dataset.id));
  });
  vp.querySelectorAll(".edge").forEach(pEl=>{
    pEl.addEventListener("click",()=>{ if(sel) open(sel); });
  });
  fit();
  document.getElementById("stats").innerHTML =
    "<h4>MEASURED</h4>"+STATS[cur].map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
}

function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* --- pan / zoom --- */
const svg=document.getElementById("svg"), vp=document.getElementById("viewport");
function apply(){ vp.setAttribute("transform",`translate(${g.x},${g.y}) scale(${g.k})`); }
function fit(){
  const r=svg.getBoundingClientRect();
  const {w,h}=layout(cur);
  const pad=110;
  g.k=Math.min((r.width-pad*2)/w,(r.height-pad)/h,1.15);
  g.k=Math.max(g.k,0.18);
  g.x=(r.width-w*g.k)/2;
  g.y=(r.height-h*g.k)/2+18;
  apply();
}
let drag=null;
svg.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,ox:g.x,oy:g.y};svg.classList.add("drag");});
window.addEventListener("mousemove",e=>{
  if(!drag)return;
  g.x=drag.ox+(e.clientX-drag.x); g.y=drag.oy+(e.clientY-drag.y); apply();
});
window.addEventListener("mouseup",()=>{drag=null;svg.classList.remove("drag");});
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12;
  const nk=Math.max(0.15,Math.min(3,g.k*f));
  g.x=mx-(mx-g.x)*(nk/g.k); g.y=my-(my-g.y)*(nk/g.k); g.k=nk; apply();
},{passive:false});

/* --- detail panel --- */
function open(id){
  const n=N[id]; if(!n)return;
  sel=id;
  document.getElementById("panel").classList.add("open");
  document.getElementById("phead").innerHTML =
     `<div class="p-kind" style="color:${n.k.c}">${n.k.t}</div>`
    +`<h2>${n.label}</h2>`
    +`<div class="path">${n.path||""}</div>`;
  let b="";
  (n.d||[]).forEach(p=>b+=`<p>${p}</p>`);
  if(n.io){
    b+=`<h3>Interface</h3><div class="io">`
      +n.io.in.map(x=>`<span class="chip in">${x}</span>`).join("")
      +n.io.out.map(x=>`<span class="chip out">${x}</span>`).join("")+"</div>";
  }
  if(n.kv){
    b+=`<h3>Parameters &amp; measurements</h3><dl class="kv">`
      +Object.entries(n.kv).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")+"</dl>";
  }
  if(n.code) b+=`<h3>Code</h3><pre>${esc(n.code)}</pre>`;
  if(n.pit){
    b+=`<h3>${n.pit.t.startsWith("Known pitfall")?"":"Watch out"}</h3>`
      +`<div class="pit${n.pit.b==="bad"?" bad":n.pit.b==="ok"?" ok":""}">`
      +`<b>${n.pit.t}</b><span>${n.pit.s}</span></div>`;
  }
  if(n.pit2){
    b+=`<div class="pit${n.pit2.b==="bad"?" bad":n.pit2.b==="ok"?" ok":""}">`
      +`<b>${n.pit2.t}</b><span>${n.pit2.s}</span></div>`;
  }
  document.getElementById("pbody").innerHTML=b;
  render();
}
function close(){ sel=null; document.getElementById("panel").classList.remove("open"); document.getElementById("pbody").innerHTML=""; render(); }

document.getElementById("zin").onclick=()=>{g.k=Math.min(3,g.k*1.2);apply();};
document.getElementById("zout").onclick=()=>{g.k=Math.max(0.15,g.k/1.2);apply();};
document.getElementById("fit").onclick=fit;
document.getElementById("relayout").onclick=render;
document.getElementById("close").onclick=close;
window.addEventListener("resize",fit);
window.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

render();
